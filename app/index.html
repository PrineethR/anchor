<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Make sense</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Make sense"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF7F0"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141312">
<link rel="stylesheet" href="static/noteworthy.css">
<style>

.sense { color: var(--fg-1); }
.sense h3 { font: var(--w-medium) var(--t-h3)/var(--lh-snug) var(--font-display); letter-spacing: 0; margin: var(--s-6) 0 var(--s-3); }
.sense h3:first-child { margin-top: 0; }
.sense ul { list-style: none; margin: 0; padding: 0; }
.thread { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s-3); margin: 0 0 var(--s-3); }
.thread-mark { padding-top: 4px; }
.thread-mark svg { display: block; width: 24px; height: 24px; }
.thread ul ul { margin: .15rem 0 .15rem .35rem; padding-left: 1rem; border-left: 1px solid var(--line-soft); }
.thread li { margin: .3rem 0; font: var(--w-regular) var(--t-body)/var(--lh-snug) var(--font-body); }
.thread > ul > li > .row { font-weight: var(--w-medium); font-size: 1.1875rem; }
.sense li[data-ids] > .row { border-radius: 6px; padding: 1px 4px; margin: 0 -4px; transition: background-color var(--dur) var(--ease-out); }
.sense li[data-ids]:hover > .row, .sense div[data-ids]:hover { background: var(--bg-sunken); }
.kt { background: linear-gradient(transparent 58%, var(--hl, color-mix(in srgb, var(--highlight) 78%, transparent)) 58%,
  var(--hl, color-mix(in srgb, var(--highlight) 78%, transparent)) 90%, transparent 90%); }
.caps { text-transform: uppercase; letter-spacing: .04em; font-family: var(--font-sans); font-weight: var(--w-semibold); font-size: .85em; }
.via { display: inline-flex; align-items: center; gap: .3em; margin-right: .5em; font: var(--w-semibold) var(--t-sm)/1 var(--font-ui);
  color: var(--ti, var(--fg-2)); white-space: nowrap; }
.via.aside { font-weight: var(--w-regular); font-style: italic; color: var(--fg-3); }
.via-arrow { flex: none; }
.ref { color: var(--fg-3); font-style: italic; }
.cb { display: inline-block; flex: none; width: 1.1em; height: 1.1em; border-radius: 50%; border: var(--stroke-bold) solid var(--line-strong);
  background: var(--bg-surface); vertical-align: -.15em; margin-right: .5em; }
.todos li { display: flex; align-items: flex-start; gap: .6rem; margin: .45rem 0; font: var(--w-regular) var(--t-body)/var(--lh-snug) var(--font-body); }
.todos .cb { margin: .2em 0 0; width: 1.25rem; height: 1.25rem; }
.todo > .cb { width: .95em; height: .95em; }
.tags { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.tag { display: inline-flex; align-items: center; gap: .5em; height: 32px; padding: 0 .9em; border-radius: var(--radius-pill);
  border: var(--stroke) solid var(--line-strong); background: var(--bg-surface); font: var(--w-medium) var(--t-sm)/1 var(--font-ui); }
.tag .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--fg-1); }
.tag .dot.hl { background: var(--highlight); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink-900) 25%, transparent); }
.tag.caps-t { text-transform: uppercase; letter-spacing: .04em; font-weight: var(--w-semibold); }
.note-group { margin: 0 0 var(--s-3); }
.note-group div { font: var(--w-regular) var(--t-body)/var(--lh-body) var(--font-body); padding: 1px 0; }
.sense .empty { color: var(--fg-3); font: var(--w-regular) var(--t-ui)/1.4 var(--font-ui); margin: 0; }


.canvas { position: relative; container-type: inline-size; min-width: 640px; background: var(--bg-surface);
  border-radius: var(--radius-xl); overflow: hidden; --hl: color-mix(in srgb, var(--highlight) 78%, transparent); }
.canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.canvas .wire { stroke: var(--fg-2); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.canvas .wire.hook { stroke-dasharray: 4 4; }
.canvas .ah { fill: var(--fg-2); }
.canvas .blob { position: absolute; border: var(--stroke) dashed var(--line-strong); color: var(--ink-300);
  background: var(--pattern-hatch); border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%; }
.canvas .box { position: absolute; transform: translate(-50%, -50%); text-align: center; padding: .1em .5em; border-radius: .7em;
  font: var(--w-regular) 1.9cqw/1.25 var(--font-serif); color: var(--fg-1); background: var(--ts, var(--bg-sunken)); }
.canvas .box.u { background: linear-gradient(transparent 62%, var(--hl) 62%, var(--hl) 90%, transparent 90%), var(--ts, var(--bg-sunken)); }
.canvas .box.c { font: var(--w-semibold) 1.45cqw/1.25 var(--font-sans); text-transform: uppercase; letter-spacing: .04em; }
.canvas .alabel { position: absolute; transform: translate(-50%, -50%); font: var(--w-semibold) 1.3cqw/1 var(--font-sans);
  color: var(--ti, var(--fg-2)); background: var(--bg-surface); padding: .25em .6em; border-radius: var(--radius-pill);
  border: 1px solid var(--line-soft); white-space: nowrap; }
.canvas.px { min-width: 0; border-radius: 0; }
.canvas.px .box { font-size: 18px; line-height: 1.3; }
.canvas.px .box.c { font-size: 14px; }
.canvas.px .alabel { font-size: 13px; }
.canvas.px .wire { stroke-width: 1.75; }
.canvas .alabel.u { background: linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 92%, transparent 92%), var(--bg-surface); }
.canvas .alabel.c { text-transform: uppercase; letter-spacing: .04em; }


/* ---- Shell: side rail from 900px, floating tab bar below ---------------------------------------------- */
html { color-scheme: light dark; }
body { min-height: 100vh; }
[hidden] { display: none !important; }
#backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.shell { position: relative; z-index: 1; }
.stage { padding: var(--s-5) var(--gutter) 9rem; max-width: var(--page-max); margin: 0 auto; }
.rail { display: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: var(--s-4) var(--gutter) 0; }
.wordmark-link { font: var(--w-regular) 1.75rem/1 var(--font-serif); letter-spacing: var(--ls-display); color: var(--fg-1); text-decoration: none; }
.wordmark-link em { font-style: italic; }
.phone-nav { position: fixed; left: 50%; translate: -50% 0; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: var(--z-nav); width: min(352px, calc(100% - 32px)); }
.phone-add { position: fixed; right: var(--gutter); bottom: calc(96px + env(safe-area-inset-bottom)); z-index: var(--z-nav); }
body.on-note .phone-add { display: none; }
@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
  .rail { display: flex; flex-direction: column; gap: var(--s-5); position: sticky; top: 0; height: 100vh; padding: var(--s-6) var(--s-4) var(--s-5); border-right: 1px solid var(--line-soft); }
  .topbar, .phone-nav, .phone-add { display: none; }
  .stage { padding-bottom: var(--s-9); width: 100%; }
}
.rail .wordmark-link { font-size: 2rem; padding: 0 var(--s-3); }
.rail-nav { display: flex; flex-direction: column; gap: var(--s-1); }
.pill { display: flex; align-items: center; gap: .75rem; height: 48px; padding: 0 var(--s-4); border-radius: var(--radius-pill); color: var(--fg-1); text-decoration: none;
  font: var(--w-medium) var(--t-ui)/1 var(--font-ui); transition: background-color var(--dur) var(--ease-out), color var(--dur) var(--ease-out); }
.pill:hover { background: var(--bg-sunken); color: var(--fg-1); }
.pill[aria-current="page"] { background: var(--action); color: var(--on-action); }
.macdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); margin-right: .5em; }
.macdot.on { background: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); }
.rail-foot { margin-top: auto; padding: 0 var(--s-3); color: var(--fg-3); font: var(--w-regular) var(--t-sm)/1.4 var(--font-ui); }

.netpill { position: fixed; top: calc(var(--s-3) + env(safe-area-inset-top)); left: 50%; translate: -50% 0; z-index: var(--z-toast); width: max-content;
  max-width: min(34rem, calc(100% - 2 * var(--gutter))); display: flex; align-items: center; padding: .55rem var(--s-4); border-radius: var(--radius-pill);
  background: var(--bg-surface); border: var(--stroke) solid var(--line-strong); box-shadow: var(--shadow-1); color: var(--fg-1); font: var(--w-medium) var(--t-sm)/1.3 var(--font-ui); }
.netpill .macdot { flex: none; background: var(--tangerine); }
.prof-account .nw-btn { margin-top: var(--s-3); }
.shared { display: grid; gap: var(--s-3); margin: var(--s-5) 0; max-width: 34rem; }
.shared img { display: block; width: 100%; max-height: 60vh; object-fit: contain; border-radius: var(--radius-xl); background: var(--bg-sunken); }
.shared-actions { display: grid; gap: var(--s-2); max-width: 22rem; }
body { overscroll-behavior-y: none; }

/* ---- Text roles --------------------------------------------------------------------------------------- */
.lead { font: var(--w-regular) var(--t-lead)/var(--lh-body) var(--font-body); color: var(--fg-1); max-width: 34rem; margin: 0; }
.hint { font: var(--w-regular) var(--t-sm)/1.45 var(--font-ui); color: var(--fg-3); margin: var(--s-2) 0 0; max-width: 34rem; }
.page-h { font: var(--w-regular) var(--t-display)/var(--lh-display) var(--font-display); letter-spacing: var(--ls-display); margin: 0 0 var(--s-4); }
.page-h em { font-style: italic; }
.section-h { font: var(--w-regular) var(--t-h2)/var(--lh-tight) var(--font-display); margin: 0 0 var(--s-4); }
.section-h em { font-style: italic; }
.nw-label { margin: 0; }

/* ---- Home --------------------------------------------------------------------------------------------- */
.home-grid { display: grid; gap: var(--section-gap) var(--s-7); margin-top: var(--s-6); }
@media (min-width: 1100px) { .home-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }
.drop { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-4); min-height: 20rem; justify-content: center; padding: var(--s-6); transition: background-color var(--dur) var(--ease-out); }
.drop.over { background: var(--bg-sunken); }
.drop-art { align-self: center; margin-bottom: var(--s-2); }
.rows { display: grid; gap: var(--s-3); list-style: none; margin: 0; padding: 0; }
.page-row { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr) auto; gap: var(--s-4); align-items: center; text-decoration: none; color: var(--fg-1); padding: var(--s-3); }
.page-row:hover { color: var(--fg-1); }
.page-row img { width: 5.5rem; height: 4rem; object-fit: cover; border-radius: var(--radius-md); background: var(--bg-sunken); display: block; }
.page-row .t { font: var(--w-medium) var(--t-h3)/var(--lh-snug) var(--font-display); overflow-wrap: anywhere; }
.page-row .nw-label { display: block; margin-top: 2px; }
.empty-state { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-3); }
.empty-state p { margin: 0; max-width: 28rem; }

/* ---- Note --------------------------------------------------------------------------------------------- */
.note-head { display: flex; gap: var(--s-3); align-items: flex-start; margin-bottom: var(--s-5); flex-wrap: wrap; }
.note-title-wrap { flex: 1 1 18rem; min-width: 0; }
.title { display: block; width: 100%; resize: none; overflow: hidden; background: transparent; border: 0; border-bottom: var(--stroke) solid transparent; border-radius: 0; padding: 2px 0;
  font: var(--w-regular) var(--t-h1)/var(--lh-tight) var(--font-display); letter-spacing: var(--ls-display); color: var(--fg-1); }
.title:hover { border-bottom-color: var(--line); }
.title:focus { outline: 0; border-bottom-color: var(--line-strong); }
.note-head .nw-label { margin-top: var(--s-2); }
.note-actions { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }
.note-grid { display: grid; gap: var(--s-7); align-items: start; }
@media (min-width: 1100px) { .note-grid { grid-template-columns: minmax(0, 1.2fr) minmax(20rem, 1fr); } .page-col { position: sticky; top: var(--s-5); } }
.modebar { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--s-3); }
.tool-status { font: var(--w-medium) var(--t-sm)/1.3 var(--font-ui); color: var(--action); }
.notice { display: flex; gap: var(--s-3); align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: var(--s-3); padding: var(--s-3) var(--s-4); border-radius: var(--radius-lg); }
.notice p { margin: 0; flex: 1 1 14rem; font: var(--w-regular) var(--t-ui)/1.4 var(--font-ui); color: var(--fg-1); }
.notice .nw-icon { flex: none; }
.frame { background: var(--bg-surface); border-radius: var(--radius-2xl); padding: 8px; box-shadow: var(--shadow-1); }
.viewer { position: relative; border-radius: var(--radius-xl); overflow: hidden; background: var(--bg-sunken); touch-action: pan-y; }
.viewer .ph { display: block; width: 100%; height: auto; }
.viewer .typed { position: absolute; inset: 0; background: var(--bg-surface); }
.viewer .typed .canvas { width: 100%; height: 100%; min-width: 0; border-radius: 0; }
.viewer .rule { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg-1); pointer-events: none; }
.viewer .rule::after { content: ""; position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%;
  background: var(--bg-surface); border: var(--stroke) solid var(--line-strong); }
.viewer .ovl { position: absolute; inset: 0; pointer-events: none; }
.viewer.fix .ovl { pointer-events: auto; }
.viewer.fix.adding .ovl { cursor: crosshair; }
.viewer .ovl svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.bx { position: absolute; border-radius: 3px; }
.bx.hl { background: color-mix(in srgb, var(--highlight) 55%, transparent); outline: 2px solid var(--highlight); }
.viewer .typed .box.hl { outline: 2px solid var(--highlight); }
.viewer.fix .bx { outline: var(--stroke) solid color-mix(in srgb, var(--action) 70%, transparent); cursor: pointer; }
.viewer.fix .bx.shape { outline-style: dashed; }
.viewer.fix .bx.doodle { outline: var(--stroke) dotted var(--danger); }
.viewer.fix .bx:hover { background: color-mix(in srgb, var(--action) 12%, transparent); }
.viewer.fix .bx.sel { outline: 3px solid var(--action); background: color-mix(in srgb, var(--action) 16%, transparent); z-index: 2; }
.viewer.fix .bx.from { outline: 3px solid var(--danger); }
.bx .tag-t { position: absolute; left: -1px; bottom: 100%; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
  font: var(--w-semibold) 11px/1.35 var(--font-ui); background: var(--action); color: var(--on-action); padding: 1px 6px; border-radius: 6px 6px 0 0; }
.bx.ghost { outline: 2px dashed var(--action); background: color-mix(in srgb, var(--action) 12%, transparent); }
.ovl .wire { stroke: var(--action); stroke-width: 2; fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.ovl .wire.hook { stroke-dasharray: 5 4; }
.ovl .ah { fill: var(--action); }
.wipe-row { margin: var(--s-3) var(--s-2) 0; }
.wipe { appearance: none; -webkit-appearance: none; width: 100%; height: 32px; background: transparent; margin: 0; cursor: pointer; }
.wipe::-webkit-slider-runnable-track { height: 8px; border-radius: var(--radius-pill); background: var(--bg-muted); border: var(--stroke) solid var(--line-strong); }
.wipe::-moz-range-track { height: 8px; border-radius: var(--radius-pill); background: var(--bg-muted); border: var(--stroke) solid var(--line-strong); box-sizing: border-box; }
.wipe::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%; background: var(--bg-surface);
  border: var(--stroke) solid var(--line-strong); transition: transform var(--dur-slow) var(--ease-spring); }
.wipe::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--bg-surface); border: var(--stroke) solid var(--line-strong); transition: transform var(--dur-slow) var(--ease-spring); }
.wipe:active::-webkit-slider-thumb { transform: scale(1.15); }
.wipe:active::-moz-range-thumb { transform: scale(1.15); }
.wipe-labels { display: flex; justify-content: space-between; font: var(--w-medium) var(--t-sm)/1.2 var(--font-ui); color: var(--fg-2); margin-top: 2px; }
.page-tools { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-4); align-items: center; }
.how { color: var(--fg-3); font: var(--w-regular) var(--t-sm)/1.3 var(--font-ui); }
.inspector { margin-top: var(--s-4); }
.inspector h2 { font: var(--w-medium) var(--t-h3)/var(--lh-snug) var(--font-display); letter-spacing: 0; margin: 0 0 var(--s-3); }
.inspector h2 em { font-style: italic; }
.inspector .field-row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; margin-top: var(--s-3); }
.sel { min-height: 40px; padding: 0 var(--s-3); border: var(--stroke) solid var(--line); border-radius: var(--radius-md); background: var(--bg-surface); font: var(--w-medium) var(--t-sm)/1 var(--font-ui); }
.sel:hover { border-color: var(--ink-400); }
.arrows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-soft); }
.arrows li { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; padding: var(--s-2) 0; border-bottom: 1px solid var(--line-soft); }
.arrows .ends { flex: 1 1 10rem; min-width: 0; font: var(--w-regular) var(--t-ui)/1.3 var(--font-body); display: inline-flex; align-items: center; gap: .4em; flex-wrap: wrap; }
.arrows input { width: 8rem; min-height: 40px; padding: 0 var(--s-3); border: var(--stroke) solid var(--line); border-radius: var(--radius-md); background: var(--bg-surface); font: var(--w-regular) var(--t-sm)/1 var(--font-body); }

.sense-col .summary { font: var(--w-regular) var(--t-lead)/var(--lh-body) var(--font-body); margin: 0 0 var(--s-3); max-width: 34rem; }
.sense-col .nw-label { margin-bottom: var(--s-4); }
.sense-col .nw-label:empty { display: none; }
.check-row { margin: var(--s-5) 0 var(--s-1); }
details.fixes { margin: var(--s-4) 0 0; font: var(--w-regular) var(--t-sm)/1.4 var(--font-ui); color: var(--fg-2); }
details.fixes summary { cursor: pointer; }
details.fixes ul { margin: var(--s-2) 0 0; padding: 0; list-style: none; font: var(--w-regular) var(--t-ui)/1.5 var(--font-body); }
details.fixes s { color: var(--fg-3); }
.sense { margin-top: var(--s-6); }

.savebar { position: fixed; left: 50%; translate: -50% 0; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: var(--z-toast); }
@media (min-width: 900px) { .savebar { bottom: var(--s-6); } }
.savebar .quiet { background: transparent; color: var(--fg-inverse); }

/* ---- Layers: sheet, busy, toast ----------------------------------------------------------------------- */
.nw-sheet .stack { display: grid; gap: var(--s-2); margin-top: var(--s-4); }
.nw-sheet .nw-sheet__title em { font-style: italic; }
.nw-sheet p { margin: 0; }
.busy { position: fixed; inset: 0; z-index: var(--z-dialog); background: var(--bg-scrim); display: grid; place-items: center; padding: var(--gutter); }
.busy-card { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); text-align: center; padding: var(--s-6) var(--s-7); }
.busy-card p { margin: 0; }
.nw-toast .nw-icon, .nw-toast .nw-shape { flex: none; }

/* ---- Profile ------------------------------------------------------------------------------------------ */
.prof { display: grid; gap: var(--s-7); margin-top: var(--s-6); }
.prof > div { min-width: 0; }
@media (min-width: 1100px) { .prof { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.prof section { margin-bottom: var(--section-gap); }
.tiles { --nw-c: var(--fg-1); --nw-oc: var(--fg-inverse); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tiles .nw-tile { --nw-oc: var(--ink-900); border-radius: var(--radius-xl); min-height: 9.5rem; }
.pairs { list-style: none; margin: 0 0 var(--s-3); padding: 0; border-top: 1px solid var(--line-soft); }
.pairs li { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; padding: var(--s-2) 0; border-bottom: 1px solid var(--line-soft); font: var(--w-regular) var(--t-body)/1.3 var(--font-body); }
.pairs .nw-field { flex: 1; min-width: 0; }
.pairs .nw-field__box { min-height: 44px; }
.pairs .means { color: var(--fg-3); font: var(--w-regular) var(--t-sm)/1 var(--font-ui); flex: none; }
.pairs .gap { flex: 1; }
.vocab { display: flex; flex-wrap: wrap; gap: var(--s-2); list-style: none; margin: 0; padding: 0; }
.prof .arrow-i { color: var(--fg-3); flex: none; }
</style>
</head>
<body>
<div id="backdrop" aria-hidden="true"></div>
<div class="shell">
  <aside class="rail" aria-label="Main">
    <a class="wordmark-link" href="#/">Make <em>sense</em></a>

/** A Lucide glyph: the Noteworthy port's own, else the rest of the system's fifty. */
function ico(name, { size = 20, sw = 1.75, cls = '' } = {}) {
  const own = ds.icon(name, { size, sw, cls });
  if (own) return own;
  const body = EXTRA_ICONS[name];
  return body ? `<svg class="nw-icon ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>` : '';
}

async function api(path, opts = {}) {
  if (window.MS_BACKEND) return window.MS_BACKEND.api(path, opts);   // the website: Firestore, not a server
  const r = await fetch('/api' + path, { ...opts, headers: { 'X-Makesense': '1', ...(opts.headers || {}) } });
  const isJson = (r.headers.get('content-type') || '').includes('json');
  const body = isJson ? await r.json() : await r.text();
  if (!r.ok) throw new Error((isJson && body.error) || r.statusText);
  return body;
}
const send = (method, path, body) => api(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });

/** An <img> source for a page's photo: the server's file here, the small copy then the full one on the website. */
const photoAttr = (id, v = '', full = true) => window.MS_BACKEND ? window.MS_BACKEND.photoAttr(id, v, full) : `src="/api/notes/${id}/photo${v ? '?v=' + v : ''}"`;
const download = path => window.MS_BACKEND ? window.MS_BACKEND.download(path).catch(oops) : void (location.href = '/api' + path);
const ago = iso => {
  const m = Math.max(0, (Date.now() - new Date(iso)) / 60000);
  return m < 2 ? 'just now' : m < 90 ? `${Math.round(m)} minutes ago` : m < 36 * 60 ? `${Math.round(m / 60)} hours ago` : `${Math.round(m / 1440)} days ago`;
};
const live = (kinds, cb) => { unsubLive?.(); unsubLive = window.MS_BACKEND ? window.MS_BACKEND.subscribe(kinds, cb) : null; };
let unsubLive = null;

const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const label = (...parts) => parts.filter(Boolean).join(' · ');

/* ---------- layers: toast, busy, sheet ---------- */
let toastTimer;
function toast(msg, { mood, icon } = {}) {
  $$('.nw-toast.transient').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'nw-toast nw-toast--float transient';
  t.setAttribute('role', 'status');
  t.innerHTML = `${mood ? ds.mood({ mood, size: 36 }) : icon ? ico(icon, { size: 22 }) : ''}<span class="nw-toast__msg">${esc(msg)}</span>`;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 4600);
}
const oops = e => toast(e.message || String(e), { icon: 'triangle-alert' });

function busy(msg, sub) {
  $('#busy')?.remove();
  if (!msg) return;
  const b = document.createElement('div');
  b.id = 'busy'; b.className = 'busy'; b.setAttribute('role', 'status');
  b.innerHTML = `<div class="nw-card nw-card--raised busy-card">${ds.illustration('loading', { size: 200 })}<p class="nw-h3">${esc(msg)}</p>${sub ? `<p class="hint">${esc(sub)}</p>` : ''}</div>`;
  document.body.appendChild(b);
}
async function guarded(msg, sub, fn) {
  busy(msg, sub);
  try { return await fn(); } catch (e) { oops(e); } finally { busy(false); }
}

/**
 * The system's Sheet: a bottom sheet on phones, a centred dialog from 768px.
 * Resolves with { id, data }: the id of the button pressed (null if dismissed), and whatever `read(el)` returned just before it closed.
 */
function sheet({ title, body = '', buttons = [], read, onMount }) {
  return new Promise(resolve => {
    const opener = document.activeElement;
    const scrim = document.createElement('div'); scrim.className = 'nw-scrim';
    const el = document.createElement('div');
    el.className = 'nw-sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = `<div class="nw-sheet__grab"></div>
      <div class="nw-sheet__head"><h2 class="nw-sheet__title">${title}</h2>
        <button type="button" class="nw-ib nw-ib--soft nw-ib--sm" data-x aria-label="Close" title="Close">${ico('x', { size: 18, sw: 1.6 })}</button></div>
      <div class="sheet-body">${body}</div>
      ${buttons.length ? `<div class="stack">${buttons.map(b => `<button type="button" class="nw-btn nw-btn--${b.variant || 'secondary'} nw-btn--block" data-id="${b.id}"${b.color ? ` style="--nw-c:var(--${b.color});--nw-oc:var(--ink-900)"` : ''}>${b.icon ? ico(b.icon, { cls: 'nw-btn__icon' }) : ''}<span>${esc(b.label)}</span></button>`).join('')}</div>` : ''}`;
    $('#layer').append(scrim, el);
    if (onMount) onMount(el);
    const close = (id, ev) => {
      const data = read ? read(el) : undefined;
      if (ev && el.querySelector(`[data-id="${id}"]`)?.classList.contains('nw-btn--primary')) ds.burstAt(el.querySelector(`[data-id="${id}"]`), ev);
      document.removeEventListener('keydown', onKey); scrim.remove(); el.remove(); opener?.focus?.(); resolve({ id, data });
    };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    scrim.onclick = () => close(null);

/** A small pill at the top while the device is offline or still sending; a toast when it catches up. */
function watchNet() {
  const B = window.MS_BACKEND;
  const pill = document.createElement('div');
  pill.className = 'netpill'; pill.setAttribute('role', 'status'); pill.hidden = true;
  document.body.appendChild(pill);
  let timer, wasOffline = false;
  const paint = () => {
    const n = B.net(), offline = !n.online || !n.connected;
    if (offline) { wasOffline = true; pill.hidden = false; pill.innerHTML = `<span class="macdot"></span>Offline. Changes send when you are back.`; }
    else if (n.pending) { pill.hidden = false; pill.innerHTML = 'Sending changes…'; }
    else { pill.hidden = true; if (wasOffline) { wasOffline = false; toast('Back online. Everything is sent.', { icon: 'check' }); } }
  };
  B.subscribe(['net'], () => { clearTimeout(timer); const n = B.net(); timer = setTimeout(paint, !n.online || !n.connected ? 2500 : 250); });   // a blip is not worth showing
}
/** A newer version of the app has been downloaded: say so, and swap only when asked. */
function watchUpdate() {
  const P = window.MS_PWA;
  if (!P) return;
  const show = () => {
    if (!P.state.updateReady || $('#updateToast')) return;
    const t = document.createElement('div');
    t.id = 'updateToast'; t.className = 'nw-toast savebar'; t.setAttribute('role', 'status');
    t.innerHTML = `<span class="nw-toast__msg">A new version is ready.</span><button class="nw-toast__act quiet" data-later type="button">Later</button><button class="nw-toast__act" data-now type="button">Reload</button>`;
    document.body.appendChild(t);
    $('[data-later]', t).onclick = () => t.remove();
    $('[data-now]', t).onclick = () => P.applyUpdate();
  };
  window.addEventListener('ms:pwa', show);

}

  const v = $('#viewer'), n = S.note, fix = S.mode === 'fix';
  v.className = 'viewer' + (fix ? ' fix' : '') + (fix && S.tool === 'add' ? ' adding' : '');
  if (!v.dataset.built || v.dataset.v !== String(S.photoV)) {
    v.dataset.built = 1; v.dataset.v = S.photoV;
    v.innerHTML = `<img class="ph" alt="Photo of your handwritten page" ${photoAttr(n.id, S.photoV)}>
      <div class="typed" id="typed"></div><div class="rule" id="rule"></div><div class="ovl" id="ovl"></div>`;
  }
  $('#typed').innerHTML = (S.preview || n).clean_html;
  applyWipe();
  renderOverlay();
}
function applyWipe() {
  const w = S.wipe;
  $('#typed').style.clipPath = `inset(0 0 0 ${w}%)`;
  $('#typed').style.display = w >= 100 ? 'none' : '';
  const rule = $('#rule'); rule.style.left = w + '%'; rule.style.display = (w <= 0 || w >= 100) ? 'none' : '';
}

function boxOf(e) { const [x, y, w, h] = e.bbox; return { x, y, w, h }; }
function edgePt(b, toward, pad) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, dx = toward[0] - cx, dy = toward[1] - cy, n = Math.hypot(dx, dy) || 1;
  let t = Math.min(dx ? (b.w / 2) / Math.abs(dx) : Infinity, dy ? (b.h / 2) / Math.abs(dy) : Infinity);
  if (t > 1) t = 0;
  return [cx + dx * t + dx / n * pad, cy + dy * t + dy / n * pad];
}
function renderOverlay() {
  const [pw, ph] = S.draft.page_size, pct = (v, t) => (100 * v / t).toFixed(3) + '%', fix = S.mode === 'fix';
  const els = S.draft.elements, byId = Object.fromEntries(els.map(e => [e.id, e]));
  const boxes = els.map(e => {
    const [x, y, w, h] = e.bbox;
    return `<div class="bx ${e.type}${S.sel === e.id ? ' sel' : ''}${S.from === e.id ? ' from' : ''}" data-id="${esc(e.id)}"
      style="left:${pct(x, pw)};top:${pct(y, ph)};width:${pct(w, pw)};height:${pct(h, ph)}">${fix && e.type === 'text' ? `<span class="tag-t">${esc(e.text || '…')}</span>` : ''}</div>`;
  }).join('');
  const pad = pw * 0.004;
  const lines = fix ? S.draft.links.map(l => {
    const a = byId[l.from], b = byId[l.to]; if (!a || !b) return '';
    const A = boxOf(a), B = boxOf(b);
    const p = edgePt(A, [B.x + B.w / 2, B.y + B.h / 2], pad), q = edgePt(B, [A.x + A.w / 2, A.y + A.h / 2], pad);
    return `<line class="wire ${esc(l.kind)}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" marker-end="url(#oah)"/>`;
  }).join('') : '';
  $('#ovl').innerHTML = `<svg viewBox="0 0 ${pw} ${ph}" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="oah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>${lines}</svg>${boxes}`;
}
function highlight(ids) {
  $$('#ovl .bx.hl, #typed .box.hl').forEach(b => b.classList.remove('hl'));
  ids.forEach(id => $$(`#ovl .bx[data-id="${CSS.escape(id)}"], #typed .box[data-id="${CSS.escape(id)}"]`).forEach(b => b.classList.add('hl')));
}

/* --- pointer handling on the photo --- */
function wireViewer() {
  const v = $('#viewer');
  let drag = null;
  v.addEventListener('pointerdown', e => {
    if (S.mode !== 'fix' || !e.target.closest('.ovl')) return;
    const bx = e.target.closest('.bx');
    if (S.tool === 'add') {
      const r = $('#ovl').getBoundingClientRect();
      drag = { r, x0: (e.clientX - r.left) / r.width, y0: (e.clientY - r.top) / r.height };
      drag.ghost = document.createElement('div'); drag.ghost.className = 'bx ghost'; $('#ovl').appendChild(drag.ghost);
      v.setPointerCapture(e.pointerId); e.preventDefault();
    } else if (S.tool === 'arrow' && bx) {
      const id = bx.dataset.id;
      if (!S.from) { S.from = id; } else if (S.from !== id) { addLink(S.from, id); S.from = null; S.tool = 'select'; }
      renderModebar(); renderOverlay(); renderInspector();
    } else if (S.tool === 'select') {
      S.sel = bx ? bx.dataset.id : null; renderOverlay(); renderInspector();
      if (bx) focusText();
    }
  });
  v.addEventListener('pointermove', e => {
    if (!drag) return;
    const x = Math.min(1, Math.max(0, (e.clientX - drag.r.left) / drag.r.width)), y = Math.min(1, Math.max(0, (e.clientY - drag.r.top) / drag.r.height));
    Object.assign(drag.ghost.style, { left: Math.min(x, drag.x0) * 100 + '%', top: Math.min(y, drag.y0) * 100 + '%', width: Math.abs(x - drag.x0) * 100 + '%', height: Math.abs(y - drag.y0) * 100 + '%' });
    drag.x1 = x; drag.y1 = y;
  });
  v.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null; d.ghost.remove();
    if (d.x1 === undefined || Math.abs(d.x1 - d.x0) < 0.01 || Math.abs(d.y1 - d.y0) < 0.008) return;
    const [pw, ph] = S.draft.page_size;
    addElement({ type: 'text', text: '', bbox: [Math.min(d.x0, d.x1) * pw, Math.min(d.y0, d.y1) * ph, Math.abs(d.x1 - d.x0) * pw, Math.abs(d.y1 - d.y0) * ph], underline: false, caps: false });
  });
}
document.addEventListener('keydown', e => {
  if (!S.note || !$('#viewer')) return;
  if (e.key === 'Escape' && S.mode === 'fix' && !$('.nw-sheet')) { S.from = null; S.tool = 'select'; S.sel = null; renderModebar(); renderOverlay(); renderInspector(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 's' && S.dirty) { e.preventDefault(); saveDraft(); }
});

/* --- editing the draft --- */
function nextId(prefix, list) { let n = 1; const ids = new Set(list.map(x => x.id)); while (ids.has(prefix + n)) n++; return prefix + n; }
function touch() { S.dirty = true; renderSavebar(); previewSoon(); }
function addElement(e) {
  e.id = nextId('u', S.draft.elements); S.draft.elements.push(e); S.sel = e.id; S.tool = 'select'; touch(); renderModebar(); renderOverlay(); renderInspector();
  focusText();
}
function focusText() { setTimeout(() => { const t = $('#editText'); if (t) { t.focus(); t.select(); } }, 0); }  // after the click's own focus change
function addLink(from, to) { S.draft.links.push({ id: nextId('m', S.draft.links), kind: 'flow', from, to }); touch(); }
function recontain(shape) {
  const inside = e => { const [x, y, w, h] = e.bbox, cx = x + w / 2, cy = y + h / 2, [sx, sy, sw, sh] = shape.bbox; return e.id !== shape.id && e.type !== 'shape' && cx >= sx && cx <= sx + sw && cy >= sy && cy <= sy + sh; };
  shape.contains = S.draft.elements.filter(inside).map(e => e.id);
}
function removeElement(id) {
  S.draft.elements = S.draft.elements.filter(e => e.id !== id);
  S.draft.links = S.draft.links.filter(l => l.from !== id && l.to !== id);
  S.draft.elements.forEach(e => { if (e.contains) e.contains = e.contains.filter(c => c !== id); });
  S.sel = null; touch(); renderOverlay(); renderInspector();
}
let previewTimer;
function previewSoon() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    try {
      const elements = S.draft.elements.filter(e => e.type !== 'text' || e.text.trim()), ids = new Set(elements.map(e => e.id));
      const complete = { ...S.draft, elements, links: S.draft.links.filter(l => ids.has(l.from) && ids.has(l.to)) };
      S.preview = await send('POST', `/notes/${S.note.id}/sense`, { page: complete });
      $('#typed').innerHTML = S.preview.clean_html; renderSense();
    } catch (err) { /* a half-edited draft may not validate yet; the last good reading stays up */ }
  }, 300);
}
async function saveDraft() {
  const empty = S.draft.elements.filter(e => e.type === 'text' && !e.text.trim()).map(e => e.id);
  empty.forEach(id => removeElement(id));
  const n = await guarded('Saving…', '', () => send('PUT', `/notes/${S.note.id}`, { page: S.draft }));
  if (!n) return;
  S.note = n; S.draft = clone(n.page); S.dirty = false; S.preview = null; S.sel = S.from = null;
  renderAll(); toast('Saved. Your corrections are in the profile.', { mood: 'joyful' });
}

function renderTools() {
  const n = S.note;
  $('#pageTools').innerHTML = `
    <button class="nw-btn nw-btn--soft nw-btn--sm" id="rotBtn" type="button">Rotate</button>
    ${n.how !== 'markers' && n.source !== 'gemini' ? `<button class="nw-btn nw-btn--soft nw-btn--sm" id="cropBtn" type="button">${n.crop ? 'Whole photo' : 'Find page edges'}</button>` : ''}
    ${n.can_read_again ? `<button class="nw-btn nw-btn--soft nw-btn--sm" id="againBtn" type="button">${n.source === 'gemini' ? 'Read again' : 'Read with Gemini'}</button>` : ''}
    <span class="how">${esc(HOW[n.how] || '')}</span>`;
  $('#rotBtn').onclick = () => reread({ rotate: true });
  const c = $('#cropBtn'); if (c) c.onclick = () => reread({ crop: !n.crop });
  const ag = $('#againBtn'); if (ag) ag.onclick = () => reread({ again: true });
}
async function reread(opts) {
  if ((S.dirty || S.note.edited) && !await ask({ title: 'Read the page <em>again?</em>', body: 'Reading again throws away the corrections you made to this page.', yes: 'Read again', no: 'Keep my edits' })) return;
  const n = await guarded('Reading again…', 'Finding the page first, then the words.', () => send('POST', `/notes/${S.note.id}/reread`, opts));
  if (!n) return;
  if (n.status && n.status !== 'ready') { S.dirty = false; toast(n.status === 'reading' ? 'Reading it again with Gemini.' : 'Sent to your Mac to read again.', { icon: 'info' }); return notePage(S.note.id); }
  Object.assign(S, { note: n, draft: clone(n.page), dirty: false, sel: null, from: null, preview: null, photoV: Date.now() });

function renderInspector() {
  const box = $('#inspector');

  const els = S.draft.elements, e = els.find(x => x.id === S.sel);
  const nameOf = id => { const x = els.find(y => y.id === id); return x ? (x.text || (x.type === 'shape' ? '(shape)' : '(drawing)')) : '?'; };
  let top;
  if (e) {
    top = `<h2>${e.type === 'text' ? 'What it <em>read</em>' : e.type === 'shape' ? 'A <em>shape</em>' : 'A <em>drawing</em>'}</h2>

      <div class="field-row">

        <select class="sel" id="etype" aria-label="Treat this as"><option value="text"${e.type === 'text' ? ' selected' : ''}>Words</option><option value="shape"${e.type === 'shape' ? ' selected' : ''}>A shape around words</option><option value="doodle"${e.type === 'doodle' ? ' selected' : ''}>A drawing, not words</option></select>
        <button type="button" class="nw-btn nw-btn--ghost nw-btn--sm" id="del">${ico('trash-2', { size: 16, cls: 'nw-btn__icon' })}<span>Remove</span></button>
      </div>`;
  } else {
    top = `<h2>Fix <em>readings</em></h2><p class="hint" style="margin:0">Click a box to fix what it read. Drag a box around a word it missed, or draw an arrow between two boxes. Your corrections teach the profile how you write.</p>`;
  }

  box.innerHTML = `<div class="nw-card nw-card--raised nw-card--sm inspector">${top}
    <h2 style="margin-top:var(--s-5)">Arrows <span class="nw-badge nw-badge--neutral nw-badge--count" style="vertical-align:middle">${S.draft.links.length}</span></h2>
    ${links ? `<ul class="arrows">${links}</ul>` : '<p class="hint" style="margin:0">None yet.</p>'}</div>`;
  if (e) {
    const t = $('#editText');

    const l = S.draft.links[+c.dataset.i]; l[c.dataset.k] = c.value;
    if (c.dataset.k === 'kind') { if (c.value !== 'connector') delete l.label; touch(); renderInspector(); } else touch();
  });
  $$('[data-rm]', box).forEach(b => b.onclick = () => { S.draft.links.splice(+b.dataset.rm, 1); touch(); renderOverlay(); renderInspector(); });
}

  else if (choice === 'md') download(`/notes/${id}/share.md`);
  else {
    try { const md = await api(`/notes/${id}/share.md`); await navigator.clipboard.writeText(md); toast('Copied. Paste it into a message.', { mood: 'joyful' }); }
    catch { download(`/notes/${id}/share.md`); toast("The clipboard wasn't available, so the file is downloading instead.", { icon: 'info' }); }
  }
}

/* ---------- profile ---------- */
async function profilePage() {
  S.dirty = false; S.note = null; paintShell('profile'); paintBackdrop(11);
  const p = await api('/profile'), st = p.stats, pct = x => Math.round(x * 100) + '%';
  const tile = (color, labelText, value, caption) => `<div class="nw-tile" style="--nw-c:var(--${color});--nw-oc:var(--ink-900)"><div class="nw-tile__label">${labelText}</div><div class="nw-tile__value">${value}</div><div class="nw-tile__caption">${caption}</div></div>`;
  app.innerHTML = `
    <h1 class="page-h">How you<br><em>write</em></h1>
    <p class="lead">What the app has picked up from the pages you checked or corrected: ${plural(p.sources.notes, 'page')} of yours and ${plural(p.sources.labeled, 'labeled page')}.</p>
    ${window.MS_BACKEND && p.learned === false ? `<p class="hint">Your Mac hasn't shared what it has learned yet, so this is where it starts. It fills in the next time the Mac is on.</p>` : ''}
    ${window.MS_BACKEND && p.pending ? `<p class="hint">${plural(p.pending, 'change')} you made here will reach your profile when your Mac is next on.</p>` : ''}
    <div class="prof">
      <div>
        <section>
          <h2 class="section-h">Your pages, <em>in numbers</em></h2>
          ${st.pages ? `<div class="nw-tile nw-tile--group tiles">
            ${tile('sky', 'Underlined', pct(st.underline_rate), 'of your notes')}
            ${tile('blush', 'Capitals', pct(st.caps_rate), 'of your notes')}
            ${tile('mint', 'Length', st.words_per_node, 'words in a note')}
            ${tile('sun', 'Arrows', st.links_per_page, 'on a page')}
          </div>
          <p class="hint">Arrows: ${Object.entries(st.link_kinds).map(([k, v]) => k === 'flow' ? plural(v, 'plain arrow') : k === 'hook' ? plural(v, 'aside') : `${v} with a word`).join(', ') || 'none yet'}${st.connector_words.length ? `. Words you put on arrows: ${st.connector_words.map(esc).join(', ')}.` : '.'}</p>`
          : `<div class="empty-state">${ds.illustration('empty-notes', { size: 170, still: true })}<p class="lead">Nothing to count yet. Check or fix a page and the numbers show up here.</p></div>`}
        </section>
        <section>
          <h2 class="section-h">Your <em>shorthand</em></h2>
          <p class="hint" style="margin-top:0">Marks you write that mean a word. The app swaps them in when it reads a page.</p>
          <ul class="pairs" id="sh"></ul>
          <button class="nw-btn nw-btn--soft nw-btn--sm" id="addSh" type="button">${ico('plus', { size: 16, cls: 'nw-btn__icon' })}<span>Add a mark</span></button>
        </section>
        <section>
          <h2 class="section-h">Lines that are <em>to-dos</em></h2>
          <div class="nw-field"><label class="nw-field__label" for="cues">A line starting with one of these goes on the to-do list. Separate them with commas.</label>
            <div class="nw-field__box"><textarea id="cues" rows="3">${esc(p.action_cues.join(', '))}</textarea></div></div>
        </section>
        <button class="nw-btn nw-btn--primary" id="saveProf" type="button"><span>Save changes</span>${ico('arrow-right', { size: 20, sw: 1.5, cls: 'nw-btn__arrow' })}</button>
      </div>
      <div>
        <section>
          <h2 class="section-h">Misreadings it <em>fixes</em></h2>
          ${p.fixes.length ? `<ul class="pairs">${p.fixes.map(f => `<li><span>${esc(f.raw)}</span>${ico('arrow-right', { size: 16, cls: 'arrow-i' })}<span>${esc(f.to)}</span><span class="gap"></span><button class="nw-btn nw-btn--ghost nw-btn--sm" data-forget="${esc(f.raw)}" type="button">Forget</button></li>`).join('')}</ul>`
            : `<div class="empty-state">${ds.mood({ mood: 'curious', size: 96, alive: true })}<p class="lead">None yet. Fix a reading on a page and it shows up here.</p></div>`}
        </section>
        <section>
          <h2 class="section-h">Words you <em>use</em></h2>
          <p class="hint" style="margin-top:0">A reading that is close to one of these, and isn't just a plural of it, gets snapped to it.</p>
          ${p.vocab.length ? `<ul class="vocab">${p.vocab.map(([w]) => `<li class="tag">${esc(w)}</li>`).join('')}</ul>` : '<p class="hint">None yet.</p>'}
        </section>
      </div>
    </div>
    ${window.MS_BACKEND ? readerBlock() : ''}
    ${window.MS_BACKEND ? `<section class="prof-account"><h2 class="section-h">Your <em>account</em></h2>
      <p class="hint" style="margin-top:0">Signed in as ${esc(window.MS_BACKEND.account.email)}.</p>
      ${installBlock()}
      <button class="nw-btn nw-btn--secondary" id="signOut" type="button"><span>Sign out</span></button></section>` : ''}`;
  const inst = $('#install'); if (inst) inst.onclick = async () => { if (await window.MS_PWA.install()) toast('Installed. Open it from your home screen.', { mood: 'joyful' }); };
  const so = $('#signOut'); if (so) so.onclick = () => window.MS_BACKEND.account.signOut();
  wireReader();
  const sh = $('#sh'), rows = Object.entries(p.shorthand);
  const addRow = (k = '', v = '') => {
    const li = document.createElement('li');
    li.innerHTML = `<div class="nw-field" style="max-width:7rem"><div class="nw-field__box"><input type="text" aria-label="The mark" value="${esc(k)}"></div></div><span class="means">means</span><div class="nw-field"><div class="nw-field__box"><input type="text" aria-label="The word" value="${esc(v)}"></div></div><button class="nw-btn nw-btn--ghost nw-btn--sm" type="button" aria-label="Remove this mark">Remove</button>`;
    li.querySelector('button').onclick = () => li.remove(); sh.appendChild(li);
  };
  rows.forEach(([k, v]) => addRow(k, v));
  $('#addSh').onclick = () => addRow();
  $('#saveProf').onclick = async () => {
    const shorthand = {}; $$('li', sh).forEach(li => { const [a, b] = $$('input', li); if (a.value.trim() && b.value.trim()) shorthand[a.value.trim()] = b.value.trim(); });
    try { await send('PUT', '/profile', { shorthand, action_cues: $('#cues').value.split(',') }); toast(window.MS_BACKEND && !window.MS_BACKEND.macState().online ? 'Saved. Your Mac applies it next time it is on.' : 'Saved. New pages will use these.', { mood: 'joyful' }); } catch (e) { oops(e); }
  };
  $$('[data-forget]').forEach(b => b.onclick = async () => { await send('PUT', '/profile', { forget: [b.dataset.forget] }); toast('Forgotten.', { icon: 'check' }); profilePage(); });
}

/* ---------- notebooks (an added section: see web/canvas.js) ---------- */
const canvasCtx = { ds, ico, esc, send, api, toast, oops, sheet, ask, guarded, plural, fmtDate, go: h => { location.hash = h; }, download,
  get cloud() { return !!window.MS_BACKEND; }, get assetUrl() { return window.MS_BACKEND && window.MS_BACKEND.assetUrl; } };   // the website's backend arrives after sign-in

async function newNotebook() {
  const nb = await guarded('Opening a fresh page…', '', () => send('POST', '/notebooks', {}));
  if (nb) location.hash = '#/nb/' + nb.id;
}
async function notebooksPage() {
  S.dirty = false; S.note = null; paintShell('notebooks'); paintBackdrop(5, { animate: true });
  const list = await api('/notebooks');
  app.innerHTML = `
    <h1 class="page-h">Think on<br><em>an endless page</em></h1>
    <p class="lead">Write anywhere, draw the arrows you would draw on paper, and circle what belongs together. Then ask it to make sense.</p>
    <ul class="covers">
      ${list.map(n => `<li><a class="cover" href="#/nb/${n.id}" style="--nw-c:var(--${n.color});--nw-oc:var(--ink-900)">
        <span class="nw-tile nw-tile--group cover-frame"><span class="nw-card nw-card--raised cover-art">${n.thumb || `<span class="cover-empty">${ds.mood({ mood: 'dreamy', size: 56 })}</span>`}</span></span>
        <span class="t">${esc(n.title)}</span>
        <span class="nw-label">${esc(label(fmtDate(n.updated), plural(n.notes, 'note'), n.threads ? plural(n.threads, 'thread') : '', n.photos ? plural(n.photos, 'photo') : ''))}</span></a></li>`).join('')}
      <li><button class="nw-card nw-card--dashed cover-new" id="newNb" type="button">${ds.illustration('empty-notes', { size: 140, still: list.length > 0 })}
        <span class="nw-btn nw-btn--primary">${ico('plus', { size: 20, cls: 'nw-btn__icon' })}<span>${list.length ? 'New notebook' : 'Start a notebook'}</span></span></button></li>
    </ul>`;
  $('#newNb').onclick = newNotebook;
}
async function canvasPage(id) {
  paintShell('canvas');
  const nbk = await guarded('Opening your notebook…', '', () => api('/notebooks/' + id));
  if (!nbk) { location.hash = '#/notebooks'; return; }
  if (!document.querySelector('link[href="web/canvas.css"]')) document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="web/canvas.css">');
  const { mountCanvas } = await import('./web/canvas.js');
  app.innerHTML = '';
  activeCanvas = mountCanvas(app, nbk, canvasCtx);
}
async function addToNotebook() {
  const list = await api('/notebooks');
  const r = await sheet({ title: 'Add to a <em>notebook</em>', body: '<p class="lead" style="font-size:var(--t-body)">The photo goes on the canvas with its words beside it, ready to move and fix. The page stays here too.</p>',
    buttons: [{ id: 'new', label: 'A new notebook', variant: 'primary', icon: 'plus' }, ...list.slice(0, 8).map(n => ({ id: 'nb:' + n.id, label: n.title, variant: 'soft' }))] });
  if (!r.id) return;
  let id = r.id.slice(3);
  if (r.id === 'new') { const created = await guarded('Opening a fresh page…', '', () => send('POST', '/notebooks', { title: S.note.title })); if (!created) return; id = created.id; }
  const out = await guarded('Putting the page on the canvas…', '', () => send('POST', `/notebooks/${id}/import`, { note_id: S.note.id }));
  if (out) { toast('Added to the notebook.', { mood: 'joyful' }); location.hash = '#/nb/' + id; }
}

(async () => {
  if (window.MS_BOOT) await window.MS_BOOT;   // the website signs you in first
  if (window.MS_BACKEND) window.MS_BACKEND.subscribe(['mac'], paintFoot);
  window.addEventListener('ms:notice', e => toast(e.detail.message, { icon: 'info' }));
  if (window.MS_BACKEND) { watchNet(); watchUpdate(); }
  try { HAS_NB = !!(await api('/status')).notebooks; } catch { HAS_NB = false; }
  if (HAS_NB) document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="web/canvas.css">');
  route();
})();
</script>
